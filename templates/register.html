<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card register-card">
            <div class="auth-header">
                <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="auth-icon register-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1>Create Account</h1>
                <p>Join our student portal</p>
            </div>

            <div class="auth-body">
                {% with messages = get_flashed_messages() %}
                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-error show">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
                {% endif %}
                {% endwith %}


                <!-- ✅ ONLY CHANGE IS HERE -->
                <form id="registerForm" method="POST">
                    <div class="form-group">
                        <div class="input-wrapper">
                            <input type="text" id="userId" name="userId" placeholder=" " required>
                            <label for="userId">User ID <span class="required">*</span></label>
                            <i class="fas fa-id-card input-icon"></i>
                        </div>
                        <span class="error-text" id="userIdError"></span>
                    </div>

                    <div class="form-group">
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" placeholder=" " required>
                            <label for="password">Password <span class="required">*</span></label>
                            <i class="fas fa-eye input-icon toggle-password" data-target="password"></i>
                        </div>
                        <div class="password-strength">
                            <div class="strength-bar"></div>
                        </div>
                        <span class="error-text" id="passwordError"></span>
                    </div>

                    <div class="form-group">
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder=" " required>
                            <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                            <i class="fas fa-check-circle input-icon toggle-password" data-target="confirmPassword"></i>
                        </div>
                        <span class="error-text" id="confirmPasswordError"></span>
                    </div>

                    <button type="submit" class="auth-btn register-btn" id="registerBtn">
                        <span class="btn-text"><i class="fas fa-user-plus"></i> Register</span>
                        <span class="btn-loader"></span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="{{ url_for('home') }}">Login here</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- JS KEPT AS-IS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>

</html>
